name: CMake on macOS (x64 & arm64)
permissions: read-all

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  VCPKG_ROOT: /Users/runner/vcpkg

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.c_compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
        - os: macos-15
          arch: arm64
          c_compiler: clang
          cpp_compiler: clang++
          build_type: Release

    steps:
    - uses: actions/checkout@v4

    - name: Install macOS dependencies
      run: |
        brew install ninja nasm autoconf automake libtool pkg-config

    - name: Make Ninja available where the presets expect it
      run: |
        sudo mkdir -p /usr/local/bin
        sudo ln -sf /opt/homebrew/bin/ninja /usr/local/bin/ninja

    - name: Bootstrap vcpkg
      run: |
        git clone --recursive https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
        "$VCPKG_ROOT"/bootstrap-vcpkg.sh -disableMetrics
        echo "VCPKG_FEATURE_FLAGS=-binarycaching" >> "$GITHUB_ENV"

    - name: Patch CMakePresets.json for CI (runner copy only)
      run: |
        python3 - <<'EOF'
        import json
        with open("CMakePresets.json") as f:
            data = json.load(f)
        for p in data["configurePresets"]:
            if p["name"] == "macos-base":
                p.setdefault("cacheVariables", {})["CMAKE_OSX_DEPLOYMENT_TARGET"] = "15.0"
        with open("CMakePresets.json", "w") as f:
            json.dump(data, f, indent=2)
        EOF

    - name: Configure CMake
      run: cmake --preset macos-universal-release

    - name: Upload vcpkg failure logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: vcpkg-logs-macos-universal
        path: |
          ${{ github.workspace }}/out/build/*/vcpkg-manifest-install.log
          ${{ github.workspace }}/out/build/*/vcpkg_installed/**/*.log
          ${{ github.workspace }}/out/build/*/vcpkg_installed/**/issue_body.md
          ${{ env.VCPKG_ROOT }}/buildtrees/**/*.log
        retention-days: 3

    - name: Build (arm64 + nested x86_64 + lipo)
      run: cmake --build out/build/macos-universal-release

    - name: Verify universal binary
      run: |
        lipo -info out/build/macos-universal-release/Genzo.app/Contents/MacOS/Genzo

    - name: Test
      run: ctest --test-dir out/build/macos-universal-release --no-tests=ignore --output-on-failure